<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ product.name }}</title>
    <style>
        body {
            background-color: #0f172a;
            color: #f8fafc;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
        }
        .details-card {
            background: #1e293b;
            border: 1px solid #334155;
            border-radius: 16px;
            display: flex;
            max-width: 700px;
            width: 90%;
            overflow: hidden;
            box-shadow: 0 0 25px rgba(0, 243, 255, 0.2);
        }
        .details-card img {
            width: 50%;
            object-fit: cover;
        }
        .info {
            padding: 30px;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }
        .info h2 {
            color: #00f3ff;
            margin-bottom: 15px;
        }
        .info p {
            color: #cbd5e1;
            margin-bottom: 20px;
            line-height: 1.6;
        }
        .price {
            font-size: 1.5rem;
            color: #a855f7;
            font-weight: bold;
            margin-bottom: 20px;
        }
        .buy-btn {
            background: #00f3ff;
            color: #0f172a;
            border: none;
            padding: 12px;
            border-radius: 8px;
            font-weight: bold;
            cursor: pointer;
            font-size: 1rem;
            transition: 0.3s;
        }
        .buy-btn:hover {
            background: #a855f7;
            color: #fff;
        }
        .back-link {
            display: inline-block;
            margin-top: 15px;
            color: #94a3b8;
            text-decoration: none;
        }
        .back-link:hover { color: #00f3ff; }
    </style>
</head>
<body>

    <div class="details-card">
        <img src="{{ product.image }}" alt="{{ product.name }}">
        <div class="info">
            <h2>{{ product.name }}</h2>
            <p>{{ product.description }}</p>
            <div class="price">السعر: {{ product.price }} ج.م</div>
            <button class="buy-btn" onclick="alert('تمت إضافة القطعة للسلة!')">شراء الآن 🛒</button>
            <a href="/" class="back-link">← العودة للمتجر</a>
        </div>
    </div>

</body>
</html>
