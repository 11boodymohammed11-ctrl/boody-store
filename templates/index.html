<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Boody Store | المتجر الرسمي</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Cairo', sans-serif; }
    </style>
</head>
<body class="bg-gray-950 text-gray-100 min-h-screen flex flex-col">

    <!-- Toast Notification -->
    <div id="toast" class="fixed top-5 left-1/2 -translate-x-1/2 z-50 bg-emerald-600 text-white px-6 py-3 rounded-xl shadow-2xl font-bold transition-all duration-300 opacity-0 pointer-events-none translate-y-[-20px]">
        تمت إضافة المنتج إلى السلة 🛍️
    </div>

    <!-- Navigation -->
    <nav class="bg-gray-900 border-b border-gray-800 sticky top-0 z-40">
        <div class="max-w-6xl mx-auto px-4 py-4 flex justify-between items-center">
            <h1 class="text-2xl font-extrabold text-transparent bg-clip-text bg-gradient-to-r from-amber-400 to-orange-500">
                Boody Store
            </h1>
            
            <button onclick="toggleCart()" class="relative bg-gray-800 hover:bg-gray-700 p-3 rounded-xl transition">
                <span class="text-xl">🛒</span>
                <span id="cart-badge" class="absolute -top-2 -right-2 bg-orange-600 text-white text-xs font-bold rounded-full h-6 w-6 flex items-center justify-center border-2 border-gray-900 hidden">0</span>
            </button>
        </div>
    </nav>

    <!-- Main Content -->
    <main class="max-w-6xl mx-auto px-4 py-8 flex-grow w-full">
        <!-- Progress Bar for Discount -->
        <div class="bg-gray-900 border border-gray-800 p-4 rounded-2xl mb-8 text-center">
            <p id="discount-banner-text" class="text-sm font-bold text-amber-400 mb-2">
                🔥 اشترِ قطعتين أو أكثر واحصل على خصم 15% فوراً!
            </p>
            <div class="w-full bg-gray-800 rounded-full h-3 overflow-hidden">
                <div id="discount-progress" class="bg-gradient-to-r from-amber-500 to-orange-500 h-full w-0 transition-all duration-500"></div>
            </div>
        </div>

        <!-- Products Grid -->
        <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-6">
            {% for p in products %}
            <div class="product-card bg-gray-900 border border-gray-800 rounded-2xl overflow-hidden hover:border-amber-500/50 transition">
                <img src="{{ url_for('static', filename='images/' + p.image) }}" alt="{{ p.name }}" class="w-full h-64 object-cover">
                <div class="p-5">
                    <h3 class="text-lg font-bold text-white mb-2">{{ p.name }}</h3>
                    <p class="text-amber-400 font-extrabold text-xl mb-4">{{ p.price }} ج.م</p>
                    
                    <div class="mb-4">
                        <label class="block text-xs text-gray-400 mb-1">المقاس:</label>
                        <select id="size-{{ p.id }}" class="w-full bg-gray-800 border border-gray-700 text-white py-2 px-3 rounded-lg focus:outline-none focus:border-amber-500">
                            {% for size in p.sizes %}
                            <option value="{{ size }}">{{ size }}</option>
                            {% endfor %}
                        </select>
                    </div>

                    <button onclick="addToCart(Number(this.dataset.id), this.dataset.name, Number(this.dataset.price))" data-id="{{ p.id }}" data-name="{{ p.name|e }}" data-price="{{ p.price }}" class="w-full bg-gradient-to-r from-amber-500 to-orange-600 hover:from-amber-600 hover:to-orange-700 text-gray-950 font-bold py-3 rounded-xl transition shadow-lg">
                        إضافة إلى السلة 🛍️
                    </button>
                </div>
            </div>
            {% endfor %}
        </div>
    </main>

    <!-- Dynamic Side Cart Modal -->
    <div id="cart-modal" class="fixed inset-0 bg-black/70 backdrop-blur-sm z-50 hidden flex justify-end">
        <div class="bg-gray-900 w-full max-w-md h-full p-6 flex flex-col justify-between overflow-y-auto border-r border-gray-800 shadow-2xl">
            <div>
                <div class="flex justify-between items-center mb-6 border-b border-gray-800 pb-4">
                    <h2 class="text-xl font-bold text-white">سلة التسوق 🛒</h2>
                    <button onclick="toggleCart()" class="text-gray-400 hover:text-white text-2xl font-bold">&times;</button>
                </div>

                <div id="cart-items" class="space-y-4">
                    <!-- Cart items rendered dynamically -->
                </div>
            </div>

            <div class="border-t border-gray-800 pt-4 mt-6">
                <div class="space-y-2 mb-4 text-sm">
                    <div class="flex justify-between text-gray-400">
                        <span>المجموع الفرعي:</span>
                        <span id="cart-subtotal" class="font-bold text-white">0 ج.م</span>
                    </div>
                    <div id="discount-row" class="flex justify-between text-emerald-400 hidden">
                        <span>الخصم (15%):</span>
                        <span id="cart-discount" class="font-bold">-0 ج.م</span>
                    </div>
                    <div class="flex justify-between text-lg font-extrabold text-amber-400 border-t border-gray-800 pt-2">
                        <span>الإجمالي:</span>
                        <span id="cart-total">0 ج.م</span>
                    </div>
                </div>

                <!-- Checkout Form -->
                <form id="checkout-form" onsubmit="sendToWhatsApp(event)" class="space-y-3">
                    <input type="text" id="cust-name" placeholder="الاسم بالكامل" required class="w-full bg-gray-800 border border-gray-700 text-white p-3 rounded-xl focus:outline-none focus:border-amber-500 text-sm">
                    <input type="tel" id="cust-phone" placeholder="رقم الهاتف" required class="w-full bg-gray-800 border border-gray-700 text-white p-3 rounded-xl focus:outline-none focus:border-amber-500 text-sm">
                    <textarea id="cust-address" placeholder="عنوان التوصيل بالتفصيل" required rows="2" class="w-full bg-gray-800 border border-gray-700 text-white p-3 rounded-xl focus:outline-none focus:border-amber-500 text-sm"></textarea>
                    
                    <button type="submit" class="w-full bg-emerald-600 hover:bg-emerald-500 text-white font-bold py-3 rounded-xl transition shadow-lg">
                        تأكيد الطلب عبر الواتساب 💬
                    </button>
                </form>
            </div>
        </div>
    </div>

    <script>
        let cart = [];

        function showToast(msg) {
            const toast = document.getElementById('toast');
            toast.innerText = msg;
            toast.classList.remove('opacity-0', 'pointer-events-none', 'translate-y-[-20px]');
            setTimeout(() => {
                toast.classList.add('opacity-0', 'pointer-events-none', 'translate-y-[-20px]');
            }, 2500);
        }

        function toggleCart() {
            document.getElementById('cart-modal').classList.toggle('hidden');
        }

        function addToCart(id, name, price) {
            const sizeSelect = document.getElementById(`size-${id}`);
            const selectedSize = sizeSelect ? sizeSelect.value : 'M';
            
            const existingItem = cart.find(item => item.id === id && item.size === selectedSize);
            if (existingItem) {
                existingItem.quantity += 1;
            } else {
                cart.push({ id, name, price, size: selectedSize, quantity: 1 });
            }

            showToast(`تمت إضافة ${name} (${selectedSize}) 🛍️`);
            updateCartUI();
        }

        function changeQuantity(index, delta) {
            cart[index].quantity += delta;
            if (cart[index].quantity <= 0) {
                cart.splice(index, 1);
            }
            updateCartUI();
        }

        async function updateCartUI() {
            const cartItemsContainer = document.getElementById('cart-items');
            const cartBadge = document.getElementById('cart-badge');
            
            // Render Badge
            const totalQuantity = cart.reduce((sum, item) => sum + item.quantity, 0);
            if (totalQuantity > 0) {
                cartBadge.innerText = totalQuantity;
                cartBadge.classList.remove('hidden');
            } else {
                cartBadge.classList.add('hidden');
            }

            // Update Progress Bar
            const progressBar = document.getElementById('discount-progress');
            const bannerText = document.getElementById('discount-banner-text');
            if (totalQuantity === 0) {
                progressBar.style.width = '0%';
                bannerText.innerText = '🔥 اشترِ قطعتين أو أكثر واحصل على خصم 15% فوراً!';
            } else if (totalQuantity === 1) {
                progressBar.style.width = '50%';
                bannerText.innerText = '⚡ ضِف قطعة أخرى الآن للحصول على خصم 15%!⚡';
            } else {
                progressBar.style.width = '100%';
                bannerText.innerText = '🎉 مبروك! حصلت على خصم 15% على إجمالي طلبك!';
            }

            // Render Cart HTML
            if (cart.length === 0) {
                cartItemsContainer.innerHTML = '<p class="text-gray-400 text-center py-8">السلة فارغة حالياً</p>';
            } else {
                cartItemsContainer.innerHTML = cart.map((item, index) => `
                    <div class="flex justify-between items-center bg-gray-800 p-3 rounded-xl border border-gray-700">
                        <div>
                            <h4 class="font-bold text-white text-sm">${item.name}</h4>
                            <p class="text-xs text-gray-400">المقاس: ${item.size} | السعر: ${item.price} ج.م</p>
                        </div>
                        <div class="flex items-center space-x-2 space-x-reverse">
                            <button onclick="changeQuantity(${index}, -1)" class="bg-gray-700 hover:bg-gray-600 text-white w-6 h-6 rounded font-bold">-</button>
                            <span class="text-sm font-bold text-white px-1">${item.quantity}</span>
                            <button onclick="changeQuantity(${index}, 1)" class="bg-gray-700 hover:bg-gray-600 text-white w-6 h-6 rounded font-bold">+</button>
                        </div>
                    </div>
                `).join('');
            }

            // Call Backend API for accurate totals & discount
            try {
                const res = await fetch('/api/cart/calculate', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ items: cart })
                });
                const data = await res.json();

                document.getElementById('cart-subtotal').innerText = `${data.subtotal} ج.م`;
                document.getElementById('cart-total').innerText = `${data.total} ج.م`;
                
                const discountRow = document.getElementById('discount-row');
                if (data.discount > 0) {
                    document.getElementById('cart-discount').innerText = `-${data.discount} ج.م`;
                    discountRow.classList.remove('hidden');
                } else {
                    discountRow.classList.add('hidden');
                }
            } catch (err) {
                console.error("خطأ في حساب الفاتورة:", err);
            }
        }

        function sendToWhatsApp(e) {
            e.preventDefault();
            if (cart.length === 0) {
                alert('السلة فارغة!');
                return;
            }

            const name = document.getElementById('cust-name').value;
            const phone = document.getElementById('cust-phone').value;
            const address = document.getElementById('cust-address').value;

            let msg = `*طلب جديد من Boody Store* 🛍️\n\n`;
            msg += `*الاسم:* ${name}\n`;
            msg += `*الهاتف:* ${phone}\n`;
            msg += `*العنوان:* ${address}\n\n`;
            msg += `*المنتجات:*\n`;

            cart.forEach(item => {
                msg += `- ${item.name} (مقاس: ${item.size}) × ${item.quantity} = ${item.price * item.quantity} ج.م\n`;
            });

            const total = document.getElementById('cart-total').innerText;
            msg += `\n*الإجمالي النهائي:* ${total}`;

            // استبدل الرقم ده برقم الواتساب الخاص بيك (بكود الدولة)
            const whatsappNumber = "201094281051"; 
            const url = `https://wa.me/${whatsappNumber}?text=${encodeURIComponent(msg)}`;
            
            window.open(url, '_blank');
        }
    </script>
</body>
</html>
